name: Deploy niva.simakov.space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niva-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://niva.simakov.space
    env:
      DEPLOY_HOST: ${{ secrets.NIVA_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.NIVA_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.NIVA_DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.NIVA_DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.NIVA_DEPLOY_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload static build
        run: |
          rsync -az --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude index.html dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error --max-time 10 https://niva.simakov.space/ >/dev/null && exit 0
            sleep 3
          done
          echo 'niva.simakov.space did not respond after deployment' >&2
          exit 1
