# Public static host for Exploded Niva Concept.
# TLS is added by Certbot after this file is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name niva.simakov.space;

    root /var/www/niva;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_static on;
    gzip_vary on;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
